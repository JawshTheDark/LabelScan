name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test and build debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: labelscan
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release from a version bump on main (a plain tag push is blocked in the
      # environment this repo is developed from, so Actions cuts the tag itself),
      # or from an explicit v* tag push.
      - name: Publish release
        if: >
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
            TAG="v$VERSION"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk labelscan.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" labelscan.apk --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --generate-notes labelscan.apk
          fi
